[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tine-cli"
version = "0.1.0"
description = "Drive a GNOME Wayland desktop from AI agents. CLI-first, no portals, no consent dialogs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Patrick Smyth" },
]
keywords = [
    "ai",
    "agent",
    "automation",
    "wayland",
    "gnome",
    "accessibility",
    "at-spi",
    "claude",
    "llm",
    "desktop",
    "computer-use",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Desktop Environment :: Gnome",
]
dependencies = [
    "evdev>=1.6",
    "Pillow>=10.0",
]
# PyGObject (gi.repository.Atspi) is deliberately NOT a pip dependency.
# Installing it from pip forces a source build of pycairo and PyGObject,
# which needs libcairo2-dev, libgirepository-2.0-dev, pkg-config, cmake,
# gcc, etc. — a fragile install that breaks on every clean system. The
# correct source for PyGObject is your distro package manager:
#   Debian/Ubuntu: sudo apt install python3-gi gir1.2-atspi-2.0
#   Arch:          sudo pacman -S python-gobject at-spi2-core
#   Fedora:        sudo dnf install python3-gobject at-spi2-core
# Tine only imports gi inside a subprocess (tine.atspi_walker), so the
# CLI and every other command work without it. Only `tine tree` and
# `tine describe` need it at runtime, and they fail with a clear
# install-instructions message if it is missing.

[project.optional-dependencies]
ocr = [
    # OCR text refs (tine screenshot --ocr, tine describe --ocr).
    # Lazy-imported by tine.ocr so tine runs fine without them.
    "rapidocr>=1.3",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/smythp/tine"
Repository = "https://github.com/smythp/tine"
Issues = "https://github.com/smythp/tine/issues"

[project.scripts]
tine = "tine.cli:main"

[tool.setuptools.packages.find]
include = ["tine*"]
exclude = ["tests*", "research*", "worktrees*", "tine.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tine/tests"]
python_files = ["test_*.py"]
